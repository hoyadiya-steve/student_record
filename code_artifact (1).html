        // NEIS Byte Calculation Helper (한글 3bytes, 영문/숫자/공백 1byte, 줄바꿈 2bytes)
        const calculateNEISBytes = (text) => {
            if (!text) return { bytes: 0, chars: 0 };
            let bytes = 0;
            const chars = text.length;
            for (let i = 0; i < text.length; i++) {
                const code = text.charCodeAt(i);
                if (code === 10) { // Newline
                    bytes += 2;
                } else if (code > 0x7F) { // Hangeul & Non-ASCII
                    bytes += 3;
                } else {
                    bytes += 1;
                }
            }
            return { bytes, chars };
        };

        function App() {
            const [schoolLevel, setSchoolLevel] = useState('elementary');
            const [students, setStudents] = useState(() => {
                const saved = localStorage.getItem('saengibo_students');
                return saved ? JSON.parse(saved) : initialStudents;
            });
            const [selectedStudentId, setSelectedStudentId] = useState(initialStudents[0].id);
            const [activeTab, setActiveTab] = useState('generator'); // 'generator' | 'bank' | 'bulk'
            
            // Generator Inputs
            const [category, setCategory] = useState('behavior');
            const [targetByteLength, setTargetByteLength] = useState(500);
            const [selectedKeywords, setSelectedKeywords] = useState([]);
            const [studentNote, setStudentNote] = useState('');
            const [generatedText, setGeneratedText] = useState('');
            const [toastMessage, setToastMessage] = useState('');
            
            // Search & Filters
            const [searchTerm, setSearchTerm] = useState('');

            // Modals & Popups
            const [isAddStudentOpen, setIsAddStudentOpen] = useState(false);
            const [isShareModalOpen, setIsShareModalOpen] = useState(false);
            const [shareModalTab, setShareModalTab] = useState('github'); // 'github' | 'file' | 'backup'
            const [newStudent, setNewStudent] = useState({ name: '', number: '', gender: '남', notes: '' });

            const fileInputRef = useRef(null);

            useEffect(() => {
                localStorage.setItem('saengibo_students', JSON.stringify(students));
            }, [students]);

            const currentStudent = useMemo(() => {
                return students.find(s => s.id === selectedStudentId) || students[0];
            }, [students, selectedStudentId]);

            useEffect(() => {
                if (currentStudent) {
                    setStudentNote(currentStudent.notes || '');
                    if (currentStudent.records && currentStudent.records[category]) {
                        setGeneratedText(currentStudent.records[category]);
                    } else {
                        setGeneratedText('');
                    }
                }
            }, [selectedStudentId, category]);

            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            });

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(''), 3200);
            };

            const toggleKeyword = (kw) => {
                if (selectedKeywords.includes(kw)) {
                    setSelectedKeywords(selectedKeywords.filter(k => k !== kw));
                } else {
                    setSelectedKeywords([...selectedKeywords, kw]);
                }
            };

            const handleGenerate = () => {
                const t = GENERATION_TEMPLATES[category] || GENERATION_TEMPLATES.behavior;
                const intro = t.intros[Math.floor(Math.random() * t.intros.length)];
                
                let detailText = studentNote.trim();
                if (selectedKeywords.length > 0) {
                    const kwText = selectedKeywords.join(', ') + " 등 관찰된 주요 특성을 바탕으로 ";
                    detailText = detailText ? `${kwText} ${detailText}` : kwText;
                }
                
                if (!detailText) {
                    detailText = schoolLevel === 'elementary' ? "수업 활동 및 모둠 협동 과정" : "수업 참여 및 비판적 사색 과정";
                }

                const bodyPattern = t.bodyPatterns[Math.floor(Math.random() * t.bodyPatterns.length)];
                let body = bodyPattern.replace('{notes}', detailText);
                const conclusion = t.conclusions[Math.floor(Math.random() * t.conclusions.length)];

                let fullResult = `${intro} ${body} ${conclusion}`;

                if (schoolLevel === 'elementary') {
                    fullResult = fullResult.replace(/확장함\./g, '확장함.').replace(/입증함\./g, '잘 나타냄.');
                }

                if (targetByteLength <= 350) {
                    fullResult = `${intro} ${bodyPattern.replace('{notes}', detailText.slice(0, 45))}`;
                } else if (targetByteLength >= 1000) {
                    const extraBody = t.bodyPatterns[(Math.floor(Math.random() * t.bodyPatterns.length) + 1) % t.bodyPatterns.length]
                        .replace('{notes}', selectedKeywords.length > 0 ? `지속적인 ${selectedKeywords[0]} 역량을 고취하며` : '스스로 세운 탐구 목표를 실천하며');
                    
                    fullResult = `${intro} ${body} 또한, ${extraBody} ${conclusion} 전반적으로 타의 모범이 되며 성장의 가능성이 무궁무진한 학생임.`;
                }

                setGeneratedText(fullResult);
                showToast("생기부 문장이 자동으로 생성되었습니다!");
            };

            const handleSaveRecord = () => {
                setStudents(prev => prev.map(s => {
                    if (s.id === selectedStudentId) {
                        return {
                            ...s,
                            notes: studentNote,
                            records: {
                                ...s.records,
                                [category]: generatedText
                            }
                        };
                    }
                    return s;
                }));
                showToast("학생 생활기록부 내용이 저장되었습니다.");
            };

            const handleCopy = (textToCopy) => {
                if (!textToCopy) return;
                const textarea = document.createElement('textarea');
                textarea.value = textToCopy;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    showToast("클립보드에 복사되었습니다! NEIS 또는 깃허브에 활용하세요.");
                } catch (err) {
                    showToast("복사에 실패했습니다.");
                }
                document.body.removeChild(textarea);
            };

            const handleDownloadHTML = () => {
                const htmlContent = document.documentElement.outerHTML;
                const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'index.html';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast("index.html 단일 파일이 다운로드되었습니다!");
            };

            const handleExportJSON = () => {
                const dataStr = JSON.stringify(students, null, 2);
                const blob = new Blob([dataStr], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `생기부_학생데이터_백업_${new Date().toISOString().slice(0, 10)}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast("학생 데이터 백업 파일(JSON)이 다운로드되었습니다.");
            };

            const handleExportCSV = () => {
                let csvContent = "\uFEFF번호,성명,성별,관찰메모,행동특성및종합의견,교과세특,창의적체험활동\n";
                students.forEach(s => {
                    const cleanNote = (s.notes || '').replace(/"/g, '""');
                    const cleanBh = (s.records?.behavior || '').replace(/"/g, '""');
                    const cleanSb = (s.records?.subject || '').replace(/"/g, '""');
                    const cleanCr = (s.records?.creative || '').replace(/"/g, '""');
                    csvContent += `"${s.number}","${s.name}","${s.gender}","${cleanNote}","${cleanBh}","${cleanSb}","${cleanCr}"\n`;
                });

                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `생기부_작성목록_${new Date().toISOString().slice(0, 10)}.csv`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast("엑셀 호환 CSV 파일이 다운로드되었습니다.");
            };

            const handleAddStudent = (e) => {
                e.preventDefault();
                if (!newStudent.name) return;
                const created = {
                    id: Date.now().toString(),
                    number: parseInt(newStudent.number) || students.length + 1,
                    name: newStudent.name,
                    gender: newStudent.gender,
                    gradeType: schoolLevel,
                    notes: newStudent.notes || '',
                    records: { behavior: '', subject: '', creative: '' }
                };
                setStudents([...students, created]);
                setSelectedStudentId(created.id);
                setNewStudent({ name: '', number: '', gender: '남', notes: '' });
                setIsAddStudentOpen(false);

                                                            >
                                                                <i data-lucide="plus" className="w-3 h-3"></i>
                                                                문장 추가
                                                            </button>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {}
                            {activeTab === 'bulk' && (
                                <div className="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm space-y-6">
                                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-100 pb-4">
                                        <div>
                                            <h3 className="text-lg font-bold text-slate-800">전체 학생 생기부 관리 및 데이터 내보내기</h3>
                                            <p className="text-xs text-slate-500 mt-1">학급 전체 학생의 작성 현황을 조회하고 엑셀(CSV) 또는 전체 텍스트로 내보낼 수 있습니다.</p>
                                        </div>
                                        
                                        <div className="flex items-center space-x-2">
                                            <button
                                                onClick={handleExportCSV}
                                                className="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-medium text-xs rounded-xl shadow-sm transition-colors flex items-center gap-1.5"
                                            >
                                                <i data-lucide="file-spread-sheet" className="w-4 h-4"></i>
                                                엑셀(CSV) 다운로드
                                            </button>
                                            <button
                                                onClick={() => {
                                                    const content = students.map(s => 
                                                        `[${s.number}번 ${s.name}]\n- 행동특성: ${s.records.behavior || '미작성'}\n- 교과세특: ${s.records.subject || '미작성'}\n- 창의체험: ${s.records.creative || '미작성'}\n\n`
                                                    ).join('-----------------------------------\n');
                                                    handleCopy(content);
                                                }}
                                                className="px-3.5 py-2 bg-slate-800 hover:bg-slate-900 text-white font-medium text-xs rounded-xl shadow-sm transition-colors flex items-center gap-1.5"
                                            >
                                                <i data-lucide="copy" className="w-4 h-4"></i>
                                                전체 텍스트 복사
                                            </button>
                                        </div>
                                    </div>

                                    <div className="overflow-x-auto border border-slate-200 rounded-xl">
                                        <table className="w-full text-left text-xs text-slate-600">
                                            <thead className="bg-slate-50 text-slate-700 font-semibold border-b border-slate-200">
                                                <tr>
                                                    <th className="p-3 w-12 text-center">번호</th>
                                                    <th className="p-3 w-20">성명</th>
                                                    <th className="p-3">행동특성 및 종합의견</th>
                                                    <th className="p-3">교과 세특</th>
                                                    <th className="p-3 w-20 text-center">작성 상태</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100">
                                                {students.map((s) => {
                                                    const bh = s.records?.behavior;
                                                    const sb = s.records?.subject;
                                                    const isComplete = bh || sb;
                                                    return (
                                                        <tr key={s.id} className="hover:bg-slate-50 transition-colors">
                                                            <td className="p-3 text-center font-bold text-slate-800">{s.number}</td>
                                                            <td className="p-3 font-medium text-slate-900">{s.name}</td>
                                                            <td className="p-3 font-gowun text-slate-700 max-w-xs truncate">
                                                                {bh || <span className="text-slate-300">미작성</span>}
                                                            </td>
                                                            <td className="p-3 font-gowun text-slate-700 max-w-xs truncate">
                                                                {sb || <span className="text-slate-300">미작성</span>}
                                                            </td>
                                                            <td className="p-3 text-center">
                                                                <span className={`px-2 py-0.5 rounded-full text-[10px] font-semibold ${
                                                                    isComplete ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-400'
                                                                }`}>
                                                                    {isComplete ? '작성 완료' : '미완료'}
                                                                </span>
                                                            </td>
                                                        </tr>
                                                    );
                                                })}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}

                        </main>
                    </div>

                    {/* Modal 1: Add New Student */}
                    {isAddStudentOpen && (
                        <div className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4 animate-in fade-in zoom-in duration-150">
                                <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                                    <h3 className="font-bold text-slate-800 text-base flex items-center gap-2">
                                        <i data-lucide="user-plus" className="w-5 h-5 text-sky-600"></i>
                                        신규 학생 등록
                                    </h3>
                                    <button
                                        onClick={() => setIsAddStudentOpen(false)}
                                        className="text-slate-400 hover:text-slate-600"
                                    >
                                        <i data-lucide="x" className="w-5 h-5"></i>
                                    </button>
                                </div>

                                <form onSubmit={handleAddStudent} className="space-y-4">
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-700 mb-1">출석 번호</label>
                                            <input
                                                type="number"
                                                required
                                                value={newStudent.number}
                                                onChange={(e) => setNewStudent({ ...newStudent, number: e.target.value })}
                                                placeholder="예: 4"
                                                className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg text-xs focus:outline-none focus:border-sky-500"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-700 mb-1">학생 이름</label>
                                            <input
                                                type="text"
                                                required
                                                value={newStudent.name}
                                                onChange={(e) => setNewStudent({ ...newStudent, name: e.target.value })}
                                                placeholder="성명"
                                                className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg text-xs focus:outline-none focus:border-sky-500"
                                            />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-700 mb-1">성별</label>
                                        <div className="flex space-x-3">
                                            {['남', '여'].map((g) => (
                                                <label key={g} className="flex items-center space-x-2 text-xs text-slate-700 cursor-pointer">
                                                    <input
                                                        type="radio"
                                                        name="gender"
                                                        value={g}
                                                        checked={newStudent.gender === g}
                                                        onChange={(e) => setNewStudent({ ...newStudent, gender: e.target.value })}
                                                        className="text-sky-600 focus:ring-sky-500"
                                                    />
                                                    <span>{g}학생</span>
                                                </label>
                                            ))}
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-700 mb-1">기본 관찰 특이사항 (선택)</label>
                                        <textarea
                                            rows="2"
                                            value={newStudent.notes}
                                            onChange={(e) => setNewStudent({ ...newStudent, notes: e.target.value })}
                                            placeholder="학생의 평소 행동 특징이나 학업 성향"
                                            className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg text-xs focus:outline-none focus:border-sky-500"
                                        ></textarea>
                                    </div>

                                    <div className="flex justify-end space-x-2 pt-2">
                                        <button
                                            type="button"
                                            onClick={() => setIsAddStudentOpen(false)}
                                            className="px-4 py-2 bg-slate-100 text-slate-600 text-xs font-medium rounded-xl hover:bg-slate-200"
                                        >
                                            취소
                                        </button>
                                        <button
                                            type="submit"
                                            className="px-4 py-2 bg-sky-600 text-white text-xs font-medium rounded-xl hover:bg-sky-700 shadow-sm"
                                        >
                                            등록하기
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {}
                    {isShareModalOpen && (
                        <div className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl max-w-2xl w-full p-6 shadow-2xl space-y-5 animate-in fade-in zoom-in duration-150 max-h-[90vh] overflow-y-auto">
                                <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                                    <div className="flex items-center gap-2">
                                        <div className="p-2 bg-slate-900 text-sky-400 rounded-xl">
                                            <i data-lucide="github" className="w-5 h-5"></i>
                                        </div>
                                        <div>
                                            <h3 className="font-bold text-slate-800 text-base">GitHub Pages 웹 공개 & 배포 가이드</h3>
                                            <p className="text-xs text-slate-500">누구나 접속할 수 있는 무료 웹 사이트주소(URL) 만들기</p>
                                        </div>
                                    </div>
                                    <button
                                        onClick={() => setIsShareModalOpen(false)}
                                        className="text-slate-400 hover:text-slate-600 p-1 rounded-lg"
                                    >
                                        <i data-lucide="x" className="w-5 h-5"></i>
                                    </button>
                                </div>

                                {/* Modal Sub-tabs */}
                                <div className="flex bg-slate-100 p-1 rounded-xl text-xs font-medium">
                                    <button
                                        onClick={() => setShareModalTab('github')}
                                        className={`flex-1 py-2 rounded-lg transition-all flex items-center justify-center gap-1.5 ${
                                            shareModalTab === 'github' ? 'bg-white text-sky-700 shadow-sm font-bold' : 'text-slate-600'
                                        }`}
                                    >
                                        <i data-lucide="github" className="w-3.5 h-3.5"></i>
                                        1. GitHub Pages 배포 절차
                                    </button>
                                    <button
                                        onClick={() => setShareModalTab('file')}
                                        className={`flex-1 py-2 rounded-lg transition-all flex items-center justify-center gap-1.5 ${
                                            shareModalTab === 'file' ? 'bg-white text-sky-700 shadow-sm font-bold' : 'text-slate-600'
                                        }`}
                                    >
                                        <i data-lucide="download" className="w-3.5 h-3.5"></i>
                                        2. index.html 파일 저장
                                    </button>
                                    <button
                                        onClick={() => setShareModalTab('backup')}
                                        className={`flex-1 py-2 rounded-lg transition-all flex items-center justify-center gap-1.5 ${
                                            shareModalTab === 'backup' ? 'bg-white text-sky-700 shadow-sm font-bold' : 'text-slate-600'
                                        }`}
                                    >
                                        <i data-lucide="database" className="w-3.5 h-3.5"></i>
                                        3. 데이터 백업
                                    </button>
                                </div>

                                {/* Tab 1: GitHub Pages Deployment Guide */}
                                {shareModalTab === 'github' && (
                                    <div className="space-y-4 text-xs text-slate-600">
                                        <div className="p-4 bg-sky-50 border border-sky-100 rounded-xl space-y-2">
                                            <div className="flex items-center justify-between">
                                                <h4 className="font-bold text-sky-900 text-sm flex items-center gap-1.5">
                                                    <i data-lucide="globe" className="w-4 h-4 text-sky-600"></i>
                                                    깃허브(GitHub Pages)로 2분 만에 나만의 웹 사이트 게시하기
                                                </h4>
                                                <button
                                                    onClick={handleDownloadHTML}
                                                    className="px-3 py-1 bg-sky-600 hover:bg-sky-700 text-white font-medium rounded-lg text-xs transition-colors flex items-center gap-1 shadow-sm"
                                                >
                                                    <i data-lucide="download" className="w-3 h-3"></i>
                                                    `index.html` 파일 먼저 받기
                                                </button>
                                            </div>
                                            <p className="text-slate-600 leading-relaxed">
                                                깃허브는 <b>무료 웹 호스팅(GitHub Pages)</b> 서비스를 제공합니다. 서버 구축 없이 `index.html` 파일 하나만 업로드하면 고유한 URL이 생성됩니다.
                                            </p>
                                        </div>

                                        <div className="space-y-3">
                                            <div className="p-3.5 bg-slate-50 border border-slate-200/80 rounded-xl space-y-1.5">
                                                <div className="flex items-center gap-2 text-slate-800 font-bold">
                                                    <span className="w-5 h-5 bg-slate-900 text-white rounded-full flex items-center justify-center text-[10px]">1</span>
                                                    깃허브 로그인 & 새 저장소(Repository) 만들기
                                                </div>
                                                <p className="pl-7 text-slate-600">
                                                    GitHub (github.com)에 로그인 후, 우측 상단 <b>[+]</b> 버튼 → <b>[New repository]</b>를 클릭합니다.
                                                    <br />
                                                    Repository name에 <code className="bg-slate-200 px-1 py-0.5 rounded text-sky-800">saengibo-helper</code> 입력 후 <b>Public</b> 상태로 <b>[Create repository]</b>를 누릅니다.
                                                </p>
                                            </div>

                                            <div className="p-3.5 bg-slate-50 border border-slate-200/80 rounded-xl space-y-1.5">
                                                <div className="flex items-center gap-2 text-slate-800 font-bold">
                                                    <span className="w-5 h-5 bg-slate-900 text-white rounded-full flex items-center justify-center text-[10px]">2</span>
                                                    `index.html` 파일 업로드하기
                                                </div>
                                                <p className="pl-7 text-slate-600">
                                                    새로 만들어진 저장소 화면에서 <b>"uploading an existing file"</b> 링크를 클릭합니다.
                                                    <br />
                                                    다운로드한 <code className="bg-slate-200 px-1 py-0.5 rounded text-sky-800">index.html</code> 파일을 드래그하여 올린 후, 아래쪽 초록색 <b>[Commit changes]</b> 버튼을 누릅니다.
                                                </p>
                                            </div>

                                            <div className="p-3.5 bg-slate-50 border border-slate-200/80 rounded-xl space-y-1.5">
                                                <div className="flex items-center gap-2 text-slate-800 font-bold">
                                                    <span className="w-5 h-5 bg-slate-900 text-white rounded-full flex items-center justify-center text-[10px]">3</span>
                                                    GitHub Pages 옵션 켜기
                                                </div>
                                                <p className="pl-7 text-slate-600">
                                                    상단 메뉴 <b>[Settings]</b> → 좌측 메뉴 <b>[Pages]</b>로 이동합니다.
                                                    <br />
                                                    Build and deployment의 <b>Branch</b> 항목을 <code className="bg-slate-200 px-1 py-0.5 rounded text-sky-800">main</code>으로 설정하고 <b>[Save]</b>를 누릅니다.
                                                </p>
                                            </div>

                                            <div className="p-3.5 bg-emerald-50 border border-emerald-200 rounded-xl space-y-1.5">
                                                <div className="flex items-center gap-2 text-emerald-900 font-bold">
                                                    <span className="w-5 h-5 bg-emerald-600 text-white rounded-full flex items-center justify-center text-[10px]">4</span>
                                                    완성된 웹 사이트 URL 접속 및 동료 공유
                                                </div>
                                                <p className="pl-7 text-emerald-800">
                                                    약 1~2분 뒤 페이지를 새로고침하면 상단에 <b>"Your site is live at https://내아이디.github.io/saengibo-helper/"</b> 주소가 생성됩니다!
                                                    이 주소를 동료 선생님들께 전달하면 웹상에서 자유롭게 사용하실 수 있습니다.
                                                </p>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {/* Tab 2: Single HTML File Download */}
                                {shareModalTab === 'file' && (
                                    <div className="space-y-4 text-xs text-slate-600">
                                        <div className="p-4 bg-slate-50 border border-slate-200 rounded-xl space-y-2">
                                            <h4 className="font-bold text-slate-800 text-sm">단일 HTML 앱 파일 소장</h4>
                                            <p className="text-slate-600 leading-relaxed">
                                                모든 스타일, 스크립트, 기능이 단 하나의 파일 안에 완벽히 통합되어 있습니다. 오프라인 상태나 개인 USB, 메일 첨부로 보관 및 공유할 수 있습니다.
                                            </p>
                                        </div>

                                        <button
                                            onClick={handleDownloadHTML}
                                            className="w-full py-3 bg-sky-600 hover:bg-sky-700 text-white font-semibold rounded-xl shadow-md transition-colors flex items-center justify-center gap-2"
                                        >
                                            <i data-lucide="file-code" className="w-4 h-4"></i>
                                            `index.html` 파일 내컴퓨터로 다운로드
                                        </button>
                                    </div>
                                )}

                                {/* Tab 3: Data Backup */}
                                {shareModalTab === 'backup' && (
                                    <div className="space-y-4 text-xs text-slate-600">
                                        <div className="p-4 bg-amber-50 border border-amber-200 rounded-xl space-y-2">
                                            <h4 className="font-bold text-amber-900 text-sm">학급 작성 데이터 백업 및 이동</h4>
                                            <p className="text-amber-800 leading-relaxed">
                                                다른 PC나 다른 브라우저로 이동할 때 작성된 학생 명단과 생성 결과를 안전하게 파일로 백업하고 가져올 수 있습니다.
                                            </p>
                                        </div>

                                        <div className="grid grid-cols-2 gap-3">
                                            <button
                                                onClick={handleExportJSON}
                                                className="p-4 bg-slate-100 hover:bg-slate-200 text-slate-800 rounded-xl font-semibold transition-colors flex flex-col items-center justify-center gap-2"
                                            >
                                                <i data-lucide="download-cloud" className="w-5 h-5 text-sky-600"></i>
                                                <span>데이터 내보내기 (JSON 백업)</span>
                                            </button>

                                            <label className="p-4 bg-slate-100 hover:bg-slate-200 text-slate-800 rounded-xl font-semibold transition-colors flex flex-col items-center justify-center gap-2 cursor-pointer">
                                                <i data-lucide="upload-cloud" className="w-5 h-5 text-emerald-600"></i>
                                                <span>데이터 불러오기 (JSON 복원)</span>
                                                <input
                                                    type="file"
                                                    accept=".json"
                                                    ref={fileInputRef}
                                                    onChange={handleImportJSON}
                                                    className="hidden"
                                                />
                                            </label>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
